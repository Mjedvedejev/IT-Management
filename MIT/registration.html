<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Registration</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <h1>LagerSync</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="add.html">Add Logs</a>
      <a href="accept.html">Accept Transport</a>
    </nav>
    <div class="user-menu">
      <img src="graphics/user_icon.png" alt="User Icon" class="user-icon">

    <div class="dropdown" id="userDropdown">
      <a href="registration.html">Register</a>
      <a href="login.html">Login</a>
    </div>
    </div>

  </header>
  <background-image="graphics /background.jpg" background-size: cover; background-position: center; height: 100vh;>
    <br><br>

    <div class="bot_container">

      <h2>Please Register</h2>

      <div class="card">
        <h3>New User Registration</h3>
          <form id="registerForm" onsubmit="registerUser(event)">
            <input type="text" id="username" placeholder="Enter username" required><br><br>
            <input type="password" id="password" placeholder="Enter password" required><br><br>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required><br><br>

            <h3>Please select your roles</h3>
            <label><input type="checkbox" name="role" value="log_owner"> Log Owner</label><br>
            <label><input type="checkbox" name="role" value="transport_provider"> Transport Provider</label><br><br>

            <button type="submit" class="button">Register</button>
          </form>
          <h3>Already Registered?</h3>
        </label>
        <button style="margin-left: 40%; width: 20%;" class="button"
          onclick="window.location.href='login.html'">Login</button>

      </div>


</body>

</html>
