<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LagerSync Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>LagerSync</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="add.html">Add Logs</a>
      <a href="accept.html">Accept Transport</a>
    </nav>
    <div class="user-menu">
      <img src="graphics/user_icon.png" alt="User Icon" class="user-icon">

    <div class="dropdown" id="userDropdown">
      <a href="registration.html">Register</a>
      <a href="login.html">Login</a>
    </div>
    </div>
  </header>
  <div class="container">

    <h2>Available Log Loads</h2>

<div class="filters">

  <input 
    type="text" 
    id="locationFilter" 
    placeholder="📍 Location"
    onkeyup="applyFilters()"
  >

  <input 
    type="date" 
    id="dateFilter"
    onchange="applyFilters()"
  >

  <input
    type="number"
    id="sizeFilter"
    placeholder="📦 Max volume (m³)"
    oninput="applyFilters()"
  >

  <button onclick="resetFilters()">Clear</button>

</div>
    <div id="logsContainer"></div>

    <script src="script.js"></script>

  </div>

</body>

</html>
